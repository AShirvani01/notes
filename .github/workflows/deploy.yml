name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - v4
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies for runnable code blocks
        run: pip install -r python-packages.txt
      - name: Set up R user library
        run: |
          mkdir -p ~/R/library
          echo "R_LIBS_USER=~/R/library" >> $GITHUB_ENV
      - name: Install R dependencies for runnable code blocks
        run: |
          Rscript -e '
            pkgs <- readLines("r-packages.txt")
            pkgs <- pkgs[nzchar(trimws(pkgs))]
            installed <- rownames(installed.packages())
            missing <- setdiff(pkgs, installed)
            if (length(missing) > 0) {
              install.packages(missing, repos = "https://cloud.r-project.org")
            }
          '
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4